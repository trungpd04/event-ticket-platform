version: '3.8'

# Shared edge gateway. The only stack that publishes public host ports.
# It terminates TLS for both domains and routes by SNI/Host to the matching
# application stack nginx over the shared overlay networks.
#
# Both overlay networks are treated as external and are created by the deploy
# workflows (or manually) before this stack is deployed.

services:
  nginx:
    image: nginx:alpine
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - type: bind
        source: /home/event-ticket/event-ticket-configuration/edge/nginx/nginx.swarm.edge.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: /home/event-ticket/event-ticket-configuration/test/ssl
        target: /etc/nginx/ssl/test
        read_only: true
      - type: bind
        source: /home/event-ticket/event-ticket-configuration/prod/ssl
        target: /etc/nginx/ssl/prod
        read_only: true
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
    networks:
      - event-ticket-network-test
      - event-ticket-network-prod

networks:
  event-ticket-network-test:
    external: true
    name: event-ticket-network-test
  event-ticket-network-prod:
    external: true
    name: event-ticket-network-prod
