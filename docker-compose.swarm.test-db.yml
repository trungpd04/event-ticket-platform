version: '3.8'

# Test database stack. Owns no host ports: PostgreSQL is reachable only over
# the shared overlay network, never from the internet.
#
# The overlay network is external and created by the deploy workflow, so
# removing/redeploying this stack never touches the network lifecycle.
# The data volume is external too, so redeploys preserve existing data.

services:
  postgres:
    image: postgres:16-alpine
    secrets:
      - db_password
    environment:
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
      POSTGRES_DB: event_ticket_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - type: volume
        source: postgres_test_data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_ticket_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
    networks:
      - event-ticket-network-test

networks:
  event-ticket-network-test:
    external: true
    name: event-ticket-network-test

volumes:
  postgres_test_data:
    external: true
    name: event-ticket-configuration_postgres_test_data

secrets:
  db_password:
    file: /home/event-ticket/secrets/test/db_password
