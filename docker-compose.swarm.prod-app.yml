version: '3.8'

# Production application stack: nginx, frontend, backend.
# The PostgreSQL database lives in docker-compose.swarm.prod-db.yml and owns
# the shared overlay network `event-ticket-network-prod`. This stack only
# attaches to it as an external network, so deploying the app never restarts
# the database.

services:
  nginx:
    image: nginx:alpine
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - type: bind
        source: /home/event-ticket/event-ticket-configuration/prod/nginx/nginx.swarm.prod.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    secrets:
      - source: prod_ssl_crt
        target: /etc/nginx/ssl/letticket.live.crt
      - source: prod_ssl_key
        target: /etc/nginx/ssl/letticket.live.key
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
    networks:
      - event-ticket-network-prod

  frontend:
    image: ghcr.io/${GHCR_OWNER}/event-ticket-fe:prod
    environment:
      TZ: Asia/Ho_Chi_Minh
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
    networks:
      - event-ticket-network-prod

  backend:
    image: ghcr.io/${GHCR_OWNER}/event-ticket-be:prod
    environment:
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-ticket-prod-db_postgres:5432/event_ticket_prod
    secrets:
      - db_password
      - jwt_secret
      - mail_username
      - mail_password
      - admin_email
      - admin_password
      - cloudinary_cloud_name
      - cloudinary_api_key
      - cloudinary_api_secret
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - event-ticket-network-prod

networks:
  event-ticket-network-prod:
    external: true
    name: event-ticket-network-prod

secrets:
  db_password:
    file: /home/event-ticket/secrets/prod/db_password
  jwt_secret:
    file: /home/event-ticket/secrets/prod/jwt_secret
  mail_username:
    file: /home/event-ticket/secrets/prod/mail_username
  mail_password:
    file: /home/event-ticket/secrets/prod/mail_password
  admin_email:
    file: /home/event-ticket/secrets/prod/admin_email
  admin_password:
    file: /home/event-ticket/secrets/prod/admin_password
  cloudinary_cloud_name:
    file: /home/event-ticket/secrets/prod/cloudinary_cloud_name
  cloudinary_api_key:
    file: /home/event-ticket/secrets/prod/cloudinary_api_key
  cloudinary_api_secret:
    file: /home/event-ticket/secrets/prod/cloudinary_api_secret
  prod_ssl_crt:
    file: /home/event-ticket/secrets/prod/letticket.live.crt
  prod_ssl_key:
    file: /home/event-ticket/secrets/prod/letticket.live.key
