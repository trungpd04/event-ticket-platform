version: '3.8'

# Production application stack: nginx, frontend, backend.
#
# - Public TLS is terminated by the shared edge stack (docker-compose.swarm.edge.yml).
#   This nginx only serves HTTP inside the overlay network, so it publishes no
#   host ports.
# - PostgreSQL lives in docker-compose.swarm.prod-db.yml; this stack attaches to
#   the shared overlay network as external.
# - Image refs are rendered by the deploy workflow so changed components use an
#   immutable git-SHA tag, while unchanged components keep their current image.

services:
  nginx:
    image: nginx:alpine
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - type: bind
        source: /home/event-ticket/event-ticket-configuration/prod/nginx/nginx.swarm.prod.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
    networks:
      - event-ticket-network-prod

  frontend:
    image: ${FE_IMAGE}
    environment:
      TZ: Asia/Ho_Chi_Minh
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
    networks:
      - event-ticket-network-prod

  backend:
    image: ${BE_IMAGE}
    environment:
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-ticket-prod-db_postgres:5432/event_ticket_prod
      PAYMENT_PROVIDER: SEPAY
      SEPAY_ENABLED: "true"
    secrets:
      - db_password
      - jwt_secret
      - google_client_id
      - mail_username
      - mail_password
      - admin_email
      - admin_password
      - cloudinary_cloud_name
      - cloudinary_api_key
      - cloudinary_api_secret
      - sepay_api_key
      - sepay_webhook_secret
      - sepay_account_number
      - sepay_bank_code
      - sepay_payment_prefix
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - event-ticket-network-prod

networks:
  event-ticket-network-prod:
    external: true
    name: event-ticket-network-prod

secrets:
  db_password:
    file: /home/event-ticket/secrets/prod/db_password
  jwt_secret:
    file: /home/event-ticket/secrets/prod/jwt_secret
  google_client_id:
    file: /home/event-ticket/secrets/prod/google_client_id
  mail_username:
    file: /home/event-ticket/secrets/prod/mail_username
  mail_password:
    file: /home/event-ticket/secrets/prod/mail_password
  admin_email:
    file: /home/event-ticket/secrets/prod/admin_email
  admin_password:
    file: /home/event-ticket/secrets/prod/admin_password
  cloudinary_cloud_name:
    file: /home/event-ticket/secrets/prod/cloudinary_cloud_name
  cloudinary_api_key:
    file: /home/event-ticket/secrets/prod/cloudinary_api_key
  cloudinary_api_secret:
    file: /home/event-ticket/secrets/prod/cloudinary_api_secret
  sepay_api_key:
    file: /home/event-ticket/secrets/prod/sepay_api_key
  sepay_webhook_secret:
    file: /home/event-ticket/secrets/prod/sepay_webhook_secret
  sepay_account_number:
    file: /home/event-ticket/secrets/prod/sepay_account_number
  sepay_bank_code:
    file: /home/event-ticket/secrets/prod/sepay_bank_code
  sepay_payment_prefix:
    file: /home/event-ticket/secrets/prod/sepay_payment_prefix
