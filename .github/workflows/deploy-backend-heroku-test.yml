name: Deploy Backend to Heroku (Test)

on:
  push:
    branches:
      - test
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.12.14
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          appdir: "backend"
          usedocker: false
        env:
          # Có thể là JDBC URL hoặc postgres:// URL của Heroku Postgres
          HD_DATABASE_URL: ${{ secrets.HEROKU_DATABASE_URL }}
          HD_JWT_SECRET: ${{ secrets.HEROKU_JWT_SECRET }}
          HD_MAIL_USERNAME: ${{ secrets.HEROKU_MAIL_USERNAME }}
          HD_MAIL_PASSWORD: ${{ secrets.HEROKU_MAIL_PASSWORD }}
          HD_ADMIN_PASSWORD: ${{ secrets.HEROKU_ADMIN_PASSWORD }}
          HD_ADMIN_EMAIL: ${{ secrets.HEROKU_ADMIN_EMAIL }}
          HD_ADMIN_FULL_NAME: ${{ secrets.HEROKU_ADMIN_FULL_NAME }}
