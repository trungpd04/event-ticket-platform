name: Deploy Backend to Heroku (Test)

on:
  push:
    branches:
      - test
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          heroku --version

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.12.14
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          appdir: "backend"
          usedocker: false
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          # Dùng cho database bên ngoài (JDBC URL). Nếu dùng Heroku Postgres, để trống.
          HD_SPRING_DATASOURCE_URL: ${{ secrets.HEROKU_SPRING_DATASOURCE_URL }}
          HD_JWT_SECRET: ${{ secrets.HEROKU_JWT_SECRET }}
          HD_MAIL_USERNAME: ${{ secrets.HEROKU_MAIL_USERNAME }}
          HD_MAIL_PASSWORD: ${{ secrets.HEROKU_MAIL_PASSWORD }}
          HD_ADMIN_PASSWORD: ${{ secrets.HEROKU_ADMIN_PASSWORD }}
          HD_ADMIN_EMAIL: ${{ secrets.HEROKU_ADMIN_EMAIL }}
          HD_ADMIN_FULL_NAME: ${{ secrets.HEROKU_ADMIN_FULL_NAME }}
