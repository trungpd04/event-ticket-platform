name: Deploy Test to Docker Swarm

on:
  push:
    branches:
      - test

permissions:
  contents: read
  packages: write

# Serialize test and prod deploys because both touch the shared edge stack.
concurrency:
  group: deploy-swarm
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'nginx/nginx.swarm.test.conf'
              - 'nginx/nginx.swarm.edge.conf'
              - 'docker-compose.swarm.test-app.yml'
              - 'docker-compose.swarm.test-db.yml'
              - 'docker-compose.swarm.edge.yml'
              - '.github/workflows/deploy-swarm-test.yml'

  build-backend:
    name: Build and push backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/event-ticket-be:test
            ghcr.io/${{ github.actor }}/event-ticket-be:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build and push frontend image
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/event-ticket-fe:test
            ghcr.io/${{ github.actor }}/event-ticket-fe:test-${{ github.sha }}
          build-args: |
            VITE_APP_API_URL=https://test.letticket.live
            VITE_APP_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy test stack to Docker Swarm
    needs: [changes, build-backend, build-frontend]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.infra == 'true') &&
      needs.build-backend.result != 'failure' &&
      needs.build-frontend.result != 'failure'
    runs-on: ubuntu-latest
    env:
      BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
      FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
      GIT_SHA: ${{ github.sha }}
      GHCR_OWNER: ${{ github.actor }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy test stack files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "docker-compose.swarm.test-app.yml,docker-compose.swarm.test-db.yml,nginx/nginx.swarm.test.conf"
          target: "/home/event-ticket/event-ticket-configuration/test"

      - name: Copy edge stack files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "docker-compose.swarm.edge.yml,nginx/nginx.swarm.edge.conf"
          target: "/home/event-ticket/event-ticket-configuration/edge"

      - name: Deploy test stack to Docker Swarm
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: BACKEND_CHANGED,FRONTEND_CHANGED,GIT_SHA,GHCR_OWNER
          script: |
            set -e
            cd /home/event-ticket/event-ticket-configuration/test

            # Login GitHub Container Registry
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

            # Ensure Docker Swarm is initialized
            docker swarm init --advertise-addr ${{ secrets.SSH_HOST }} || true

            # Prepare secrets directory
            rm -rf /home/event-ticket/secrets/test
            mkdir -p /home/event-ticket/secrets/test

            # Write secrets
            echo '${{ secrets.DB_PASSWORD_TEST }}' > /home/event-ticket/secrets/test/db_password
            echo '${{ secrets.JWT_SECRET_TEST }}' > /home/event-ticket/secrets/test/jwt_secret
            echo '${{ secrets.GOOGLE_CLIENT_ID }}' > /home/event-ticket/secrets/test/google_client_id
            echo '${{ secrets.MAIL_USERNAME }}' > /home/event-ticket/secrets/test/mail_username
            echo '${{ secrets.MAIL_PASSWORD }}' > /home/event-ticket/secrets/test/mail_password
            echo '${{ secrets.ADMIN_EMAIL }}' > /home/event-ticket/secrets/test/admin_email
            echo '${{ secrets.ADMIN_PASSWORD }}' > /home/event-ticket/secrets/test/admin_password
             echo '${{ secrets.CLOUDINARY_CLOUD_NAME }}' > /home/event-ticket/secrets/test/cloudinary_cloud_name
             echo '${{ secrets.CLOUDINARY_API_KEY }}' > /home/event-ticket/secrets/test/cloudinary_api_key
             echo '${{ secrets.CLOUDINARY_API_SECRET }}' > /home/event-ticket/secrets/test/cloudinary_api_secret
             echo '${{ secrets.SEPAY_API_KEY }}' > /home/event-ticket/secrets/test/sepay_api_key
             echo '${{ secrets.SEPAY_WEBHOOK_SECRET }}' > /home/event-ticket/secrets/test/sepay_webhook_secret
             echo '${{ secrets.SEPAY_ACCOUNT_NUMBER }}' > /home/event-ticket/secrets/test/sepay_account_number
             echo '${{ secrets.SEPAY_BANK_CODE }}' > /home/event-ticket/secrets/test/sepay_bank_code
             echo '${{ secrets.SEPAY_PAYMENT_PREFIX }}' > /home/event-ticket/secrets/test/sepay_payment_prefix

            # Copy SSL certificates to secrets directory
            cp /home/event-ticket/event-ticket-configuration/test/ssl/test.letticket.live.crt /home/event-ticket/secrets/test/
            cp /home/event-ticket/event-ticket-configuration/test/ssl/test.letticket.live.key /home/event-ticket/secrets/test/

            # One-time migration: remove the legacy combined stack (nginx + app + db)
            # if it still exists. Named volumes are external, so data survives.
            if docker stack ls --format '{{.Name}}' | grep -qx 'event-ticket-test'; then
              echo "Removing legacy combined stack event-ticket-test ..."
              docker stack rm event-ticket-test
              for i in $(seq 1 30); do
                if ! docker stack ls --format '{{.Name}}' | grep -qx 'event-ticket-test'; then
                  break
                fi
                sleep 2
              done
            fi

            wait_port_free() {
              port="$1"
              for i in $(seq 1 60); do
                if ! ss -ltn 2>/dev/null | grep -q ":$port "; then
                  echo "Port $port is free"
                  return 0
                fi
                echo "Waiting for port $port to be released (attempt $i/60) ..."
                sleep 2
              done
              echo "ERROR: port $port is still in use. Current listeners:"
              ss -ltnp 2>/dev/null | grep ":$port " || true
              echo "Docker containers publishing this port:"
              docker ps -a --filter "publish=$port" --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
              return 1
            }

            # Both overlay networks are shared infrastructure, created here so
            # the DB, app and edge stacks can all reference them as external.
            for net in event-ticket-network-test event-ticket-network-prod; do
              if ! docker network inspect "$net" >/dev/null 2>&1; then
                echo "Creating overlay network $net ..."
                docker network create --driver overlay --attachable "$net"
              fi
            done

            # Ensure the external database volume exists (data is preserved).
            if ! docker volume inspect event-ticket-configuration_postgres_test_data >/dev/null 2>&1; then
              docker volume create event-ticket-configuration_postgres_test_data
            fi

            # Resolve immutable image refs. Changed components use the new
            # git-SHA tag; unchanged components keep the image currently running.
            SHORT_SHA="$GIT_SHA"
            if [ "$BACKEND_CHANGED" = "true" ]; then
              BE_IMAGE="ghcr.io/$GHCR_OWNER/event-ticket-be:test-$SHORT_SHA"
            else
              BE_IMAGE="$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' event-ticket-test-app_backend 2>/dev/null || true)"
              [ -n "$BE_IMAGE" ] || BE_IMAGE="ghcr.io/$GHCR_OWNER/event-ticket-be:test"
            fi
            if [ "$FRONTEND_CHANGED" = "true" ]; then
              FE_IMAGE="ghcr.io/$GHCR_OWNER/event-ticket-fe:test-$SHORT_SHA"
            else
              FE_IMAGE="$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' event-ticket-test-app_frontend 2>/dev/null || true)"
              [ -n "$FE_IMAGE" ] || FE_IMAGE="ghcr.io/$GHCR_OWNER/event-ticket-fe:test"
            fi
            export BE_IMAGE FE_IMAGE
            echo "Backend image:  $BE_IMAGE"
            echo "Frontend image: $FE_IMAGE"

            # Deploy the database stack first (internal PostgreSQL, external data volume).
            docker stack deploy -c docker-compose.swarm.test-db.yml event-ticket-test-db --with-registry-auth

            # Provide a localhost-only administration tunnel without sudo.
            # The tunnel joins the attachable overlay and forwards to the DB
            # service; the database itself has no published Swarm port.
            docker rm -f event-ticket-test-pg-local 2>/dev/null || true
            docker run -d --restart unless-stopped --name event-ticket-test-pg-local \
              --network event-ticket-network-test \
              -p 127.0.0.1:5433:5432 \
              alpine/socat \
              TCP-LISTEN:5432,fork,reuseaddr TCP:event-ticket-test-db_postgres:5432

            # Deploy the application stack (HTTP only, no host ports).
            envsubst < docker-compose.swarm.test-app.yml > docker-compose.swarm.test-app.rendered.yml
            docker stack deploy -c docker-compose.swarm.test-app.rendered.yml event-ticket-test-app --with-registry-auth
            rm -f docker-compose.swarm.test-app.rendered.yml

            # The edge stack needs public ports 80/443. On the very first deploy
            # another stack (for example a not-yet-migrated prod-app) may still
            # hold them; wait and then fail with diagnostics. On later deploys
            # the edge itself owns the ports, so skip the wait.
            if ! docker stack ls --format '{{.Name}}' | grep -qx 'event-ticket-edge'; then
              wait_port_free 80
              wait_port_free 443
            fi

            # Deploy the shared edge gateway last.
            cd /home/event-ticket/event-ticket-configuration/edge
            docker stack deploy -c docker-compose.swarm.edge.yml event-ticket-edge --with-registry-auth

            # Force recreate nginx services so they re-read bind-mounted config.
            docker service update --force event-ticket-test-app_nginx
            docker service update --force event-ticket-edge_nginx

            # Show services
            docker service ls
