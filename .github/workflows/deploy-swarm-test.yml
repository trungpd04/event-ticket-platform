name: Deploy Test to Docker Swarm

on:
  push:
    branches:
      - test

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-swarm-test
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'nginx/nginx.swarm.test.conf'
              - 'docker-compose.swarm.test-app.yml'
              - 'docker-compose.swarm.test-db.yml'
              - '.github/workflows/deploy-swarm-test.yml'

  build-backend:
    name: Build and push backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.actor }}/event-ticket-be:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build and push frontend image
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.actor }}/event-ticket-fe:test
          build-args: |
            VITE_APP_API_URL=https://test.letticket.live
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy test stack to Docker Swarm
    needs: [changes, build-backend, build-frontend]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.infra == 'true') &&
      needs.build-backend.result != 'failure' &&
      needs.build-frontend.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy stack files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "docker-compose.swarm.test-app.yml,docker-compose.swarm.test-db.yml,nginx/nginx.swarm.test.conf"
          target: "/home/event-ticket/event-ticket-configuration/test"

      - name: Deploy test stack to Docker Swarm
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd /home/event-ticket/event-ticket-configuration/test

            # Login GitHub Container Registry
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

            # Ensure Docker Swarm is initialized
            docker swarm init --advertise-addr ${{ secrets.SSH_HOST }} || true

            # Prepare secrets directory
            rm -rf /home/event-ticket/secrets/test
            mkdir -p /home/event-ticket/secrets/test

            # Write secrets
            echo '${{ secrets.DB_PASSWORD_TEST }}' > /home/event-ticket/secrets/test/db_password
            echo '${{ secrets.JWT_SECRET_TEST }}' > /home/event-ticket/secrets/test/jwt_secret
            echo '${{ secrets.MAIL_USERNAME }}' > /home/event-ticket/secrets/test/mail_username
            echo '${{ secrets.MAIL_PASSWORD }}' > /home/event-ticket/secrets/test/mail_password
            echo '${{ secrets.ADMIN_EMAIL }}' > /home/event-ticket/secrets/test/admin_email
            echo '${{ secrets.ADMIN_PASSWORD }}' > /home/event-ticket/secrets/test/admin_password
            echo '${{ secrets.CLOUDINARY_CLOUD_NAME }}' > /home/event-ticket/secrets/test/cloudinary_cloud_name
            echo '${{ secrets.CLOUDINARY_API_KEY }}' > /home/event-ticket/secrets/test/cloudinary_api_key
            echo '${{ secrets.CLOUDINARY_API_SECRET }}' > /home/event-ticket/secrets/test/cloudinary_api_secret

            # Copy SSL certificates to secrets directory
            cp /home/event-ticket/event-ticket-configuration/test/ssl/test.letticket.live.crt /home/event-ticket/secrets/test/
            cp /home/event-ticket/event-ticket-configuration/test/ssl/test.letticket.live.key /home/event-ticket/secrets/test/

            # One-time migration: remove the old combined stack (nginx + app + db)
            # if it still exists. Named volumes are external, so the database
            # data survives this removal.
            if docker stack ls --format '{{.Name}}' | grep -qx 'event-ticket-test'; then
              echo "Removing legacy combined stack event-ticket-test ..."
              docker stack rm event-ticket-test
              for i in $(seq 1 30); do
                if ! docker stack ls --format '{{.Name}}' | grep -qx 'event-ticket-test'; then
                  break
                fi
                sleep 2
              done
              # Give Docker a moment to release the published ports before the
              # new DB stack binds them.
              sleep 5
            fi

            # Ensure the external database volume exists before deploying the DB stack.
            if ! docker volume inspect event-ticket-configuration_postgres_test_data >/dev/null 2>&1; then
              docker volume create event-ticket-configuration_postgres_test_data
            fi

            # Render the database stack and deploy it first so its overlay
            # network exists before the app stack attaches to it.
            envsubst < docker-compose.swarm.test-db.yml > docker-compose.swarm.test-db.rendered.yml
            docker stack deploy -c docker-compose.swarm.test-db.rendered.yml event-ticket-test-db --with-registry-auth
            rm -f docker-compose.swarm.test-db.rendered.yml

            # Wait for the shared overlay network to be created by the DB stack.
            for i in $(seq 1 30); do
              if docker network inspect event-ticket-network-test >/dev/null 2>&1; then
                break
              fi
              echo "Waiting for network event-ticket-network-test ..."
              sleep 2
            done

            # Render and deploy the application stack.
            GHCR_OWNER='${{ github.actor }}' envsubst < docker-compose.swarm.test-app.yml > docker-compose.swarm.test-app.rendered.yml
            docker stack deploy -c docker-compose.swarm.test-app.rendered.yml event-ticket-test-app --with-registry-auth
            rm -f docker-compose.swarm.test-app.rendered.yml

            # Force recreate nginx so it re-reads the bind-mounted config.
            docker service update --force event-ticket-test-app_nginx

            # Show services
            docker service ls
