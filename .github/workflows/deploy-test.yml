name: Deploy Test

on:
  push:
    branches:
      - test

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'nginx/**'
              - 'docker-compose.yml'
              - '.github/workflows/deploy-test.yml'

  build-backend:
    name: Build and push backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/trungpd/event-ticket-be:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build and push frontend image
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/trungpd/event-ticket-fe:test
          build-args: |
            VITE_APP_API_URL=https://test.letticket.live
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy test services to server
    needs: [changes, build-backend, build-frontend]
    # Run when at least one path changed and no triggered build failed.
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.infra == 'true') &&
      needs.build-backend.result != 'failure' &&
      needs.build-frontend.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose and nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "docker-compose.yml,nginx/nginx.conf"
          target: "/opt/event-ticket"

      - name: Deploy test stack on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd /opt/event-ticket

            # Create env file with all secrets
            cat > .env << 'EOF'
            DB_PASSWORD_TEST=${{ secrets.DB_PASSWORD_TEST }}
            DB_PASSWORD_PROD=${{ secrets.DB_PASSWORD_PROD }}
            JWT_SECRET_TEST=${{ secrets.JWT_SECRET_TEST }}
            JWT_SECRET_PROD=${{ secrets.JWT_SECRET_PROD }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            EOF

            # Login GitHub Container Registry on the server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            BACKEND_CHANGED="${{ needs.changes.outputs.backend }}"
            FRONTEND_CHANGED="${{ needs.changes.outputs.frontend }}"
            INFRA_CHANGED="${{ needs.changes.outputs.infra }}"

            # Restart only the services whose image changed
            if [ "$BACKEND_CHANGED" = "true" ]; then
              echo "Backend changed: pulling and restarting backend-test"
              docker pull ghcr.io/trungpd/event-ticket-be:test
              docker compose up -d backend-test
            fi

            if [ "$FRONTEND_CHANGED" = "true" ]; then
              echo "Frontend changed: pulling and restarting frontend-test"
              docker pull ghcr.io/trungpd/event-ticket-fe:test
              docker compose up -d frontend-test
            fi

            # Compose or nginx config changed: apply the whole stack and reload nginx
            if [ "$INFRA_CHANGED" = "true" ]; then
              echo "Infra changed: applying compose and reloading nginx"
              docker compose up -d
              docker compose exec -T nginx nginx -s reload || true
            fi

            # Cleanup unused images
            docker image prune -f
