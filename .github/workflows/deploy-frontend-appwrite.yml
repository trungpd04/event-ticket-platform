name: Deploy Frontend to Appwrite

on:
  push:
    branches:
      - test
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Create production env file
        run: |
          echo "VITE_APP_API_URL=${{ secrets.APPWRITE_VITE_APP_API_URL }}" > .env
          echo "VITE_APP_BASE_NAME=${{ secrets.APPWRITE_VITE_APP_BASE_NAME }}" >> .env

      - name: Package source code
        run: |
          zip -r source.zip . \
            -x "node_modules/*" \
            -x "dist/*" \
            -x ".git/*"

      - name: Deploy to Appwrite
        run: |
          echo "Deploying to: ${{ secrets.APPWRITE_ENDPOINT }}/v1/sites/${{ secrets.APPWRITE_SITE_ID }}/deployments"
          curl -X POST "${{ secrets.APPWRITE_ENDPOINT }}/v1/sites/${{ secrets.APPWRITE_SITE_ID }}/deployments" \
            -H "X-Appwrite-Project: ${{ secrets.APPWRITE_PROJECT_ID }}" \
            -H "X-Appwrite-Key: ${{ secrets.APPWRITE_API_KEY }}" \
            -F "code=@source.zip" \
            -F "activate=true" \
            -w "\nHTTP Status: %{http_code}\n" \
            -o response.txt
          echo "Response body:"
          cat response.txt
