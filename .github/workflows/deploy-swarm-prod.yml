name: Deploy Production to Docker Swarm

on:
  push:
    branches:
      - prod

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-swarm-prod
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'nginx/nginx.swarm.prod.conf'
              - 'docker-compose.swarm.prod.yml'
              - '.github/workflows/deploy-swarm-prod.yml'

  build-backend:
    name: Build and push backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.actor }}/event-ticket-be:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build and push frontend image
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.actor }}/event-ticket-fe:prod
          build-args: |
            VITE_APP_API_URL=https://letticket.live
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production stack to Docker Swarm
    needs: [changes, build-backend, build-frontend]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.infra == 'true') &&
      needs.build-backend.result != 'failure' &&
      needs.build-frontend.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy stack files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "docker-compose.swarm.prod.yml,nginx/nginx.swarm.prod.conf"
          target: "/home/event-ticket/event-ticket-configuration/prod"

      - name: Deploy production stack to Docker Swarm
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd /home/event-ticket/event-ticket-configuration/prod

            # Login GitHub Container Registry
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

            # Ensure Docker Swarm is initialized
            docker swarm init --advertise-addr ${{ secrets.SSH_HOST }} || true

            # Prepare secrets directory
            rm -rf /home/event-ticket/secrets/prod
            mkdir -p /home/event-ticket/secrets/prod

            # Write secrets
            echo '${{ secrets.DB_PASSWORD_PROD }}' > /home/event-ticket/secrets/prod/db_password
            echo '${{ secrets.JWT_SECRET_PROD }}' > /home/event-ticket/secrets/prod/jwt_secret
            echo '${{ secrets.MAIL_USERNAME }}' > /home/event-ticket/secrets/prod/mail_username
            echo '${{ secrets.MAIL_PASSWORD }}' > /home/event-ticket/secrets/prod/mail_password
            echo '${{ secrets.ADMIN_EMAIL }}' > /home/event-ticket/secrets/prod/admin_email
            echo '${{ secrets.ADMIN_PASSWORD }}' > /home/event-ticket/secrets/prod/admin_password
            echo '${{ secrets.CLOUDINARY_CLOUD_NAME }}' > /home/event-ticket/secrets/prod/cloudinary_cloud_name
            echo '${{ secrets.CLOUDINARY_API_KEY }}' > /home/event-ticket/secrets/prod/cloudinary_api_key
            echo '${{ secrets.CLOUDINARY_API_SECRET }}' > /home/event-ticket/secrets/prod/cloudinary_api_secret

            # Copy SSL certificates to secrets directory
            cp /home/event-ticket/event-ticket-configuration/prod/ssl/letticket.live.crt /home/event-ticket/secrets/prod/
            cp /home/event-ticket/event-ticket-configuration/prod/ssl/letticket.live.key /home/event-ticket/secrets/prod/

            # Render stack file with GHCR owner
            GHCR_OWNER='${{ github.actor }}' envsubst < docker-compose.swarm.prod.yml > docker-compose.swarm.prod.rendered.yml

            # Deploy stack
            docker stack deploy -c docker-compose.swarm.prod.rendered.yml event-ticket-prod --with-registry-auth

            # Clean up temporary rendered stack file
            rm -f docker-compose.swarm.prod.rendered.yml

            # Show services
            docker service ls
