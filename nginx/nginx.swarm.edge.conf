# Shared edge gateway: terminates TLS for both domains on 80/443 and routes
# each host to its application stack over the Swarm overlay networks.
#
# - test.letticket.live -> event-ticket-test-app_nginx:80
# - letticket.live      -> event-ticket-prod-app_nginx:80
#
# This is the only service in the whole deployment that publishes host ports
# 80/443. The app stacks and the databases stay internal.

server {
    listen 80;
    server_name test.letticket.live letticket.live;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name test.letticket.live;

    ssl_certificate     /etc/nginx/ssl/test/test.letticket.live.crt;
    ssl_certificate_key /etc/nginx/ssl/test/test.letticket.live.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;
    resolver 127.0.0.11 valid=10s;

    set $test_upstream event-ticket-test-app_nginx;

    location / {
        proxy_pass http://$test_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    server_name letticket.live;

    ssl_certificate     /etc/nginx/ssl/prod/letticket.live.crt;
    ssl_certificate_key /etc/nginx/ssl/prod/letticket.live.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;
    resolver 127.0.0.11 valid=10s;

    set $prod_upstream event-ticket-prod-app_nginx;

    location / {
        proxy_pass http://$prod_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
    }
}
