spring:
  application:
    name: event-ticket-platform
  profiles:
    active: test

ticket:
  pool:
    batch-size: 500
    warm-size: 100

payment:
  provider: ${PAYMENT_PROVIDER:MOCK}
  sepay:
    enabled: ${SEPAY_ENABLED:false}
    api-key: ${SEPAY_API_KEY:}
    webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
    account-number: ${SEPAY_ACCOUNT_NUMBER:}
    bank-code: ${SEPAY_BANK_CODE:Vietcombank}
    payment-prefix: ${SEPAY_PAYMENT_PREFIX:DH}

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    issuer: ${GOOGLE_ISSUER:https://accounts.google.com}
    jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
  auth:
    cookie:
      name: refresh_token
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
      domain: ${AUTH_COOKIE_DOMAIN:}
      path: /api/v1/auth
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://test.letticket.live,https://letticket.live}
  scheduler:
    time-zone: ${APP_SCHEDULER_TIME_ZONE:Asia/Ho_Chi_Minh}
