version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: event-ticket-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/event-ticket/event-ticket-configuration/ssl:/etc/nginx/ssl:ro
    networks:
      - event-ticket-network

  frontend-test:
    image: ghcr.io/${GHCR_OWNER:-trungpd}/event-ticket-fe:test
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_API_URL: https://test.letticket.live
    container_name: event-ticket-frontend-test
    restart: unless-stopped
    networks:
      - event-ticket-network

  backend-test:
    image: ghcr.io/${GHCR_OWNER:-trungpd}/event-ticket-be:test
    container_name: event-ticket-backend-test
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/event_ticket_test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_TEST:-postgres}
      JWT_SECRET: ${JWT_SECRET_TEST:-mSZzfEFQlQu5uqQrQFE6GRT9xzPzfJa3/rv5/prak1I=}
      MAIL_USERNAME: ${MAIL_USERNAME:-your-email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your-app-password}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - event-ticket-network

  postgres-test:
    image: postgres:16-alpine
    container_name: event-ticket-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: event_ticket_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD_TEST:-postgres}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - event-ticket-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d event_ticket_test" ]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend-prod:
    image: ghcr.io/${GHCR_OWNER:-trungpd}/event-ticket-fe:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_API_URL: https://letticket.live
    container_name: event-ticket-frontend-prod
    restart: unless-stopped
    networks:
      - event-ticket-network

  backend-prod:
    image: ghcr.io/${GHCR_OWNER:-trungpd}/event-ticket-be:prod
    container_name: event-ticket-backend-prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-prod:5432/event_ticket_prod
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD_PROD}
      JWT_SECRET: ${JWT_SECRET_PROD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    depends_on:
      postgres-prod:
        condition: service_healthy
    networks:
      - event-ticket-network

  postgres-prod:
    image: postgres:16-alpine
    container_name: event-ticket-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: event_ticket_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD_PROD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - event-ticket-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d event_ticket_prod" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
  postgres_prod_data:

networks:
  event-ticket-network:
    driver: bridge
